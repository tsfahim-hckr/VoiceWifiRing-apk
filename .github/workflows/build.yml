name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          [ -z "$F" ] && echo "settings.gradle.kts paoa jay ni" && exit 1
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceWifiRing-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
